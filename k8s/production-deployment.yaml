apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-devops-app
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-devops-app
  template:
    metadata:
      labels:
        app: secure-devops-app
    spec:
      containers:
        - name: flask-app
          image: vishal249/secure-devops-app:1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
